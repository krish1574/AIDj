apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'expo-module-gradle-plugin'

group = 'dj.ai.analysis'
version = '0.1.0'

android {
  namespace 'dj.ai.analysis'

  ndkVersion '27.1.12297006'

  defaultConfig {
    minSdkVersion 26
    versionCode 1
    versionName '0.1.0'

    externalNativeBuild {
      cmake {
        cppFlags '-std=c++17', '-fexceptions', '-frtti'
        arguments '-DANDROID_STL=c++_shared'
      }
    }

    ndk {
      abiFilters 'arm64-v8a', 'x86_64'
    }
  }

  externalNativeBuild {
    cmake {
      path 'CMakeLists.txt'
      version '3.22.1'
    }
  }

  // The analyser links the same engine as aidj-audio, which needs Oboe's
  // prefab headers at configure time even though nothing here plays audio.
  buildFeatures {
    prefab true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }
}

dependencies {
  implementation 'com.google.oboe:oboe:1.9.3'
  implementation 'androidx.work:work-runtime-ktx:2.9.1'
}
