apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'expo-module-gradle-plugin'

group = 'dj.ai.library'
version = '0.1.0'

android {
  namespace 'dj.ai.library'

  defaultConfig {
    minSdkVersion 26
    versionCode 1
    versionName '0.1.0'
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.13.1'
}
